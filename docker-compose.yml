version: '3.8'

# Postgres is hosted on Supabase — no local Postgres container needed.
# This file only runs Redis for Person D's queues and rate limiting.

services:
  redis:
    image: redis:7-alpine
    container_name: globetrotter_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
